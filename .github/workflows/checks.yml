name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check && uv run ruff format --check && uv run mypy
      - run: uv run python -m unittest discover -s tests -v
      - run: shellcheck watch_link/templates/launch.sh
      - run: |
          docker run --rm -v "$PWD/deploy:/config:ro" caddy:2 caddy adapt --config /config/dashboard-access.Caddyfile.example --adapter caddyfile | uv run python tests/check_dashboard_config.py
      - run: MEDIA_ROOT=/tmp/media docker compose -f deploy/compose.yml --profile vpn config -q
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $source = Get-Content watch_link/templates/launch.ps1 -Raw
          $source = $source.Replace('@@MOVIE@@', "'https://example.com/movie.mp4'").Replace('@@ROOM@@', "'room'").Replace('@@SERVER@@', "'syncplay.pl:8999'").Replace('@@SYNC@@', '$false')
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          & ([scriptblock]::Create($source)) -DryRun
